[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replylab"
version = "0.1.0"
description = "A local harness for replayable two-seat chats"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
replylab = "replylab.cli:main"

[tool.setuptools]
packages = ["replylab"]

[tool.setuptools.package-data]
replylab = ["web/*"]
