name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.4
      - run: python -m ruff check --select E4,E7,E9,F,B replylab tests
      - name: Check browser JavaScript syntax
        run: node --input-type=module --check < replylab/web/app.js

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  browser:
    name: Package and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 playwright==1.64.1
      - name: Build and install the wheel from the source distribution
        run: |
          python -m build
          python -m pip install dist/*.whl
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python tests/browser_smoke.py

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [lint, tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          printf 'Lint=%s Tests=%s Browser=%s\n' "$LINT" "$TESTS" "$BROWSER"
          test "$LINT" = success && test "$TESTS" = success && test "$BROWSER" = success
